[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-skill-conformance"
version = "0.1.0"
description = "A product-independent security and conformance layer for Agentic Skills."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Khadija Shahzad" }]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_conformance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
