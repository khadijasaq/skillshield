name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "No tests/ directory in this checkout; skipping pytest."
          fi
